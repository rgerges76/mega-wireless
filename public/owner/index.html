<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Mega Wireless Owner Growth Dashboard</title><style>
:root{color-scheme:dark;--bg:#07102d;--panel:#10194a;--cyan:#00e5ff;--green:#00d97e;--muted:#aebfe8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#18266d,var(--bg) 42%);color:#fff;font:15px Arial,sans-serif}.wrap{width:min(1200px,94%);margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.pill{padding:8px 12px;border-radius:99px;background:rgba(0,217,126,.12);color:#7dffc4;border:1px solid rgba(0,217,126,.35)}button{border:0;border-radius:10px;padding:11px 16px;background:linear-gradient(135deg,#2f6bff,#a855f7);color:#fff;font-weight:900;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0}.card,.panel{background:rgba(16,25,74,.92);border:1px solid rgba(0,229,255,.22);border-radius:16px;padding:18px}.card span{display:block;color:var(--muted);font-size:12px}.card strong{font-size:30px;color:var(--cyan)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel h2{font-size:18px}.bar{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08);padding:9px 0}.advice li{margin:10px 0;line-height:1.5}.status{padding:24px;text-align:center}.hidden{display:none}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.card strong{font-size:24px}}
</style></head><body><main class="wrap"><div class="top"><div><div class="pill">PRIVATE • OWNER ONLY</div><h1>Mega Wireless Growth Dashboard</h1><p>Business actions, not vanity metrics.</p></div><button id="logout" class="hidden">Log out</button></div><section id="login" class="panel status"><h2>Owner authentication required</h2><p>Use the invite-only Mega Wireless Owner account.</p><button id="loginButton">Secure sign in</button></section><section id="dashboard" class="hidden"><div class="cards" id="cards"></div><div class="grid"><article class="panel"><h2>Lead Funnel</h2><div id="funnel"></div></article><article class="panel"><h2>Traffic Sources</h2><div id="sources"></div></article><article class="panel"><h2>Top Repairs</h2><div id="repairs"></div></article><article class="panel"><h2>Top Phones</h2><div id="phones"></div></article><article class="panel"><h2>Top Campaigns</h2><div id="campaigns"></div></article><article class="panel"><h2>Connected Accounts</h2><div id="integrations"></div></article></div><article class="panel advice" style="margin-top:16px"><h2>What Ramy Should Do Tomorrow</h2><ol id="advice"></ol></article></section></main><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script><script>
(function(){var identity=window.netlifyIdentity,login=document.getElementById('login'),dashboard=document.getElementById('dashboard'),logout=document.getElementById('logout'),currentUser=null;function rows(id,data){document.getElementById(id).innerHTML=(data&&data.length?data:[{name:'No data yet',value:0}]).map(function(x){return '<div class="bar"><span>'+String(x.name).replace(/[<>]/g,'')+'</span><strong>'+Number(x.value||0)+'</strong></div>'}).join('')}async function authorize(provider){if(!currentUser)return;var token=await currentUser.jwt(),response=await fetch('/.netlify/functions/oauth-start',{method:'POST',credentials:'same-origin',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify({provider:provider})}),data=await response.json();if(!response.ok){alert(data.error||'Authorization is not configured yet.');return}location.href=data.authorization_url}async function load(user){currentUser=user;var token=await user.jwt();var response=await fetch('/.netlify/functions/owner-dashboard',{headers:{authorization:'Bearer '+token},credentials:'same-origin'});if(!response.ok)throw new Error('Owner access required');var data=await response.json(),t=data.today,c=t.counts,f=t.funnel;login.classList.add('hidden');dashboard.classList.remove('hidden');logout.classList.remove('hidden');var metrics=[['Visitors',f.visitors],['Repair Leads',c.repair_quote_completed||0],['Calls',c.call_clicked||0],['Directions',c.directions_clicked||0],['Messages',c.contact_clicked||0],['Bookings',c.repair_booking_completed||0],['AI Chats',c.ai_chat_started||0],['Conversion',t.conversion_rate+'%']];document.getElementById('cards').innerHTML=metrics.map(function(x){return '<div class="card"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>'}).join('');rows('funnel',Object.entries(f).map(function(x){return{name:x[0],value:x[1]}}));rows('sources',t.sources);rows('repairs',t.repairs);rows('phones',t.phones);rows('campaigns',t.campaigns);document.getElementById('integrations').innerHTML='<div class="bar"><span>Google Analytics, Search &amp; Maps</span><strong>'+(data.integrations.google?'Connected':'Authorization required')+'</strong></div><button id="googleConnect">'+(data.integrations.google?'Reconnect Google':'Connect Google')+'</button><div class="bar"><span>Facebook + Instagram</span><strong>'+(data.integrations.meta?'Connected':'Authorization required')+'</strong></div><button id="metaConnect">'+(data.integrations.meta?'Reconnect Meta':'Connect Meta')+'</button>';document.getElementById('googleConnect').onclick=function(){authorize('google')};document.getElementById('metaConnect').onclick=function(){authorize('meta')};document.getElementById('advice').innerHTML=(data.recommendations.length?data.recommendations:['More live data is required before a specific recommendation can be made.']).map(function(x){return '<li>'+String(x).replace(/[<>]/g,'')+'</li>'}).join('')}function sync(user){if(user)load(user).catch(function(){login.querySelector('p').textContent='This account is not authorized as Owner.'});else{currentUser=null;login.classList.remove('hidden');dashboard.classList.add('hidden');logout.classList.add('hidden')}}identity.on('init',sync);identity.on('login',function(user){identity.close();sync(user)});identity.on('logout',function(){sync(null)});document.getElementById('loginButton').onclick=function(){identity.open('login')};logout.onclick=function(){identity.logout()};identity.init()})();
</script></body></html>
