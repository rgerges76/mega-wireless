<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mega Wireless Reports</title><style>
body{margin:0;font-family:Arial;background:#020715;color:#f8fbff}.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top h1{margin-right:auto}.btn{border:0;padding:10px 13px;border-radius:9px;background:#182a48;color:#fff;font-weight:800;cursor:pointer}.card,.kpi{background:#07152e;border:1px solid #1a3e75;border-radius:12px;padding:14px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px;margin:14px 0}.kpi b{font-size:24px;color:#ffbd35}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #16335d;text-align:left}th{color:#9ec8ff}.status{color:#ffbd35;font-weight:800;margin:8px 0}.tablewrap{overflow:auto}@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div class="top"><h1>MEGA WIRELESS — Reports</h1><button class="btn" onclick="location.href='pos.html'">Back to POS</button><button class="btn" onclick="location.href='inventory.html'">Inventory</button></div><div class="card" style="margin-top:12px"><label>From <input type="date" id="dateFrom" onchange="renderSelected()" style="padding:8px"></label> <label>To <input type="date" id="dateTo" onchange="renderSelected()" style="padding:8px"></label> <button class="btn" onclick="setRange(0)">Today</button> <button class="btn" onclick="setRange(30)">Last 30 Days</button> <button class="btn" onclick="setRange(-1)">All Time</button></div><div id="msg" class="status">Loading...</div><div class="kpis"><div class="kpi">Selected Period Sales<br><b id="today">$0.00</b></div><div class="kpi">Selected Period Cash<br><b id="d30">$0.00</b></div><div class="kpi">Selected Period Gross Profit<br><b id="profit">$0.00</b></div><div class="kpi">Transactions<br><b id="count">0</b></div></div><div class="card tablewrap"><table><thead><tr><th>Date</th><th>Receipt</th><th>Payment</th><th>Subtotal</th><th>Tax</th><th>Total</th></tr></thead><tbody id="rows"></tbody></table></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(MW_CONFIG.SUPABASE_URL,MW_CONFIG.SUPABASE_ANON_KEY),money=n=>'$'+Number(n||0).toFixed(2);
let allSales=[],allItems=[];
function dateKey(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function setRange(days){const now=new Date();dateTo.value=dateKey(now);if(days===-1){dateFrom.value='';dateTo.value=''}else{const from=new Date(now);from.setDate(now.getDate()-(days===0?0:days-1));dateFrom.value=dateKey(from)}renderSelected()}
function renderSelected(){
 const from=dateFrom.value,to=dateTo.value;
 if(from&&to&&from>to){msg.textContent='Start date must be before end date';return}
 const selected=allSales.filter(x=>{const d=dateKey(x.created_at);return (!from||d>=from)&&(!to||d<=to)});
 const ids=new Set(selected.map(x=>x.id));
 today.textContent=money(selected.reduce((a,x)=>a+Number(x.total||0),0));
 d30.textContent=money(selected.filter(x=>x.payment_method==='cash').reduce((a,x)=>a+Number(x.total||0),0));
 count.textContent=selected.length;
 profit.textContent=money(allItems.filter(x=>ids.has(x.sale_id)).reduce((a,x)=>a+(Number(x.unit_price)-Number(x.unit_cost))*Number(x.quantity),0));
 rows.innerHTML=selected.map(x=>'<tr><td>'+new Date(x.created_at).toLocaleString()+'</td><td>'+(x.receipt_number||'')+'</td><td>'+(x.payment_method||'')+'</td><td>'+money(x.subtotal)+'</td><td>'+money(x.tax)+'</td><td>'+money(x.total)+'</td></tr>').join('');
 msg.textContent='Showing '+selected.length+' transactions. Gross profit excludes operating expenses.';
}
async function init(){
 const {data:{session}}=await sb.auth.getSession();if(!session){location.href='pos.html';return}
 try{
 let offset=0;while(true){const {data,error}=await sb.from('sales').select('id,receipt_number,subtotal,tax,total,payment_method,created_at').order('created_at',{ascending:false}).range(offset,offset+499);if(error)throw error;allSales.push(...(data||[]));if(!data||data.length<500)break;offset+=500}
 const ids=allSales.map(x=>x.id);
 for(let i=0;i<ids.length;i+=100){const {data,error}=await sb.from('sale_items').select('sale_id,quantity,unit_price,unit_cost').in('sale_id',ids.slice(i,i+100));if(error)throw error;allItems.push(...(data||[]))}
 setRange(30);
 }catch(e){msg.textContent=e.message}
}
init();</script></body></html>
