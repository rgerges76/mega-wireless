backend:
  name: git-gateway
  branch: main

publish_mode: simple
media_folder: "assets"
public_folder: "/assets"

locale: "en"

collections:
  - name: "offers"
    label: "Daily Offers / العروض اليومية"
    files:
      - name: "offers"
        label: "Today's Offers"
        file: "offers.json"
        description: "Turn offers on and off. Only offers with the switch ON and a future end date show on the website."
        fields:
          - name: "offers"
            label: "Offers List"
            label_singular: "Offer"
            widget: "list"
            summary: "{{fields.title}} — {{fields.price}}"
            fields:
              - name: "title"
                label: "Offer Title (e.g. Student Screen Repair)"
                widget: "string"
              - name: "price"
                label: "Big Price Text (e.g. $10 Off  /  Save $15  /  $79)"
                widget: "string"
              - name: "description"
                label: "Description — one or two short lines"
                widget: "text"
              - name: "valid_until"
                label: "Offer Ends On"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
              - name: "active"
                label: "Show on website?"
                widget: "boolean"
                default: false
