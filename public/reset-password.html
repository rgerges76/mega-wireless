<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Reset Admin Password | Mega Wireless</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#132b75,#07102d 58%);font-family:Arial,Helvetica,sans-serif;color:#fff}.card{width:min(540px,100%);padding:28px;border-radius:20px;border:1px solid rgba(0,229,255,.4);background:rgba(9,16,54,.94);box-shadow:0 22px 70px rgba(0,0,0,.45)}h1{margin:0 0 10px;font-size:30px}p{color:#c6d3ef;line-height:1.6}.brand{font-size:12px;font-weight:900;letter-spacing:.15em;color:#00e5ff;margin-bottom:16px}.notice{padding:12px 14px;border-radius:12px;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.22);font-size:14px}.btn{display:inline-flex;margin-top:16px;padding:12px 16px;border-radius:10px;background:#2f6bff;color:#fff;text-decoration:none;font-weight:900}
</style>
</head>
<body>
<main class="card">
<div class="brand">MEGA WIRELESS • SECURE ADMIN</div>
<h1>Reset your admin password</h1>
<p id="message">Checking the secure password-recovery link…</p>
<div class="notice">For security, never send the recovery link, recovery token, password, or 2FA code to anyone.</div>
<a class="btn" href="/admin/">Back to Secure Admin</a>
</main>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
(function(){
  var message=document.getElementById('message');
  var hash=location.hash||'';
  if(!/recovery_token=/.test(hash)){
    message.textContent='This page needs a fresh password-recovery link. Return to Secure Admin and choose Forgot password again.';
    return;
  }
  if(!window.netlifyIdentity){
    message.textContent='Secure login service did not load. Refresh this page and try again.';
    return;
  }
  window.netlifyIdentity.on('init',function(){
    message.textContent='Recovery link verified. Use the secure Netlify window to choose your new password.';
  });
  window.netlifyIdentity.on('open',function(){
    message.textContent='Secure recovery window opened. Enter your new password there.';
  });
  window.netlifyIdentity.on('login',function(){location.replace('/admin/')});
  window.netlifyIdentity.on('error',function(){message.textContent='The recovery link is invalid or expired. Request a new password-reset email from Secure Admin.'});
})();
</script>
</body>
</html>
