<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Mega Wireless POS</title>
<style>
:root{--bg:#020715;--panel:#07152e;--panel2:#0a1d40;--line:#1a3e75;--blue:#167aff;--gold:#ffbd35;--text:#f8fbff;--muted:#9eafcc;--danger:#ff5570}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.hidden{display:none!important}
.shell{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:100vh}.main{padding:18px}.side{background:#061127;border-left:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
.top{display:grid;grid-template-columns:auto minmax(240px,1fr) auto auto;gap:10px;align-items:center;margin-bottom:12px}.top h1{font-size:22px;margin:0}.top input{padding:13px;border-radius:9px;border:1px solid #294b7c;background:#030a18;color:#fff}
.btn{border:0;padding:11px 14px;border-radius:9px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}.btn.gray{background:#182a48}.btn.red{background:var(--danger)}.btn:disabled{opacity:.55;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted);margin-bottom:14px}.products{display:grid;grid-template-columns:repeat(5,minmax(145px,1fr));gap:10px}.product{background:linear-gradient(180deg,var(--panel2),#061025);border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer}.product:hover{border-color:#36b8ff}.product b{display:block}.product .price{color:var(--gold);font-size:20px;font-weight:900;margin:8px 0}.meta{font-size:12px;color:var(--muted)}
.cart-row{display:grid;grid-template-columns:minmax(0,1fr) 62px 78px 30px;gap:6px;align-items:center;border-bottom:1px solid #16335d;padding:9px 0}.cart-row input{width:100%;padding:7px;border-radius:6px;border:1px solid #294b7c;background:#020713;color:#fff}.cart-row button{border:0;border-radius:6px;background:#3b1830;color:#fff;height:31px}
.total{font-size:31px;font-weight:900;color:var(--gold)}.pay{display:grid;grid-template-columns:1fr 1fr;gap:9px}.status{min-height:22px;color:var(--gold);font-weight:800;margin:8px 0}.badge{display:inline-block;padding:5px 8px;border:1px solid #31588e;border-radius:999px;font-size:11px;color:#cfe2ff}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:100}.modal.open{display:flex}.card{width:min(470px,94vw);background:#08172f;border:1px solid #2b558f;border-radius:18px;padding:22px}.card h2{margin-top:0}.card input{width:100%;padding:12px;border-radius:8px;border:1px solid #294b7c;background:#030a18;color:#fff;margin:6px 0}
.receipt{display:none}@media print{@page{size:80mm auto;margin:0}body *{visibility:hidden!important}#receipt,#receipt *{visibility:visible!important}#receipt{display:block!important;position:absolute;left:0;top:0;width:72mm;background:#fff!important;color:#000!important;padding:4mm;font-family:Arial;font-size:11px}.center{text-align:center}.rrow{display:flex;justify-content:space-between;gap:8px}hr{border:0;border-top:1px dashed #000}}
@media(max-width:1000px){.products{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto}.products{grid-template-columns:repeat(2,1fr)}.top{grid-template-columns:1fr}.top h1{margin-bottom:4px}}
</style>
</head>
<body>
<div id="loginModal" class="modal open"><div class="card"><h2>Staff Login</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="btn" style="width:100%;margin-top:8px" onclick="signIn()">Login</button><div id="loginMsg" class="status"></div></div></div>
<div id="cardModal" class="modal"><div class="card"><h2>Card Payment</h2><input id="last4" inputmode="numeric" maxlength="4" placeholder="Last 4 digits"><div id="cardMsg" class="status"></div><button class="btn" onclick="completeCard()">Complete Sale</button> <button class="btn gray" onclick="closeCard()">Cancel</button></div></div>
<div class="shell"><main class="main"><div class="top"><h1>MEGA WIRELESS POS</h1><input id="search" autocomplete="off" placeholder="Scan barcode / IMEI / search product"><label><input type="checkbox" id="taxEnabled" checked> Tax</label><button class="btn gray" onclick="signOut()">Logout</button></div><div class="hint">Live inventory from Mega Wireless. Search by name, SKU, barcode, quick code, IMEI or serial.</div><div id="products" class="products"></div></main>
<aside class="side"><h2>Current Sale</h2><div id="cart"></div><p>Subtotal: <b id="subtotal">$0.00</b></p><p>Tax: <b id="tax">$0.00</b></p><p class="total">Total: <span id="total">$0.00</span></p><div class="pay"><button class="btn" onclick="checkoutCash()">Cash</button><button class="btn" onclick="openCard()">Credit</button></div><div id="saleMsg" class="status"></div><button class="btn gray" onclick="clearCart()">Clear</button> <button class="btn gray" onclick="printReceipt()">Print Last Receipt</button></aside></div>
<div id="receipt" class="receipt"><div class="center"><b style="font-size:17px">MEGA WIRELESS</b><div>4717 Nolensville Pike</div><div>Nashville, TN 37211</div><div>615-678-5849</div></div><hr><div id="receiptMeta"></div><hr><div id="receiptItems"></div><hr><div id="receiptTotals"></div><hr><div class="center">Thank you for your business!</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(MW_CONFIG.SUPABASE_URL,MW_CONFIG.SUPABASE_ANON_KEY);let products=[],units=[],cart=[],lastReceipt=null;const money=n=>'$'+Number(n||0).toFixed(2);
async function signIn(){const e=email.value.trim(),p=password.value;loginMsg.textContent='Signing in...';const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error){loginMsg.textContent=error.message;return}loginModal.classList.remove('open');await loadProducts()}
async function signOut(){await sb.auth.signOut();location.reload()}
async function requireSession(){const {data}=await sb.auth.getSession();if(data?.session){loginModal.classList.remove('open');await loadProducts()}}
async function fetchAll(table,select,filters=[]){let all=[],from=0,size=1000;while(true){let q=sb.from(table).select(select).range(from,from+size-1);for(const f of filters){if(f.type==='eq')q=q.eq(f.col,f.val);if(f.type==='order')q=q.order(f.col,{ascending:f.asc!==false})}const {data,error}=await q;if(error)throw error;all=all.concat(data||[]);if(!data||data.length<size)break;from+=size}return all}
async function loadProducts(){saleMsg.textContent='Loading inventory...';try{products=await fetchAll('products','*',[{type:'eq',col:'active',val:true},{type:'order',col:'name',asc:true}]);try{units=await fetchAll('inventory_units','id,product_id,unit_code,status',[{type:'eq',col:'status',val:'available'}])}catch(_){units=[]}saleMsg.textContent='';renderProducts()}catch(e){saleMsg.textContent=e.message}}
function qtyFor(p){return Number(p.quantity||0)}
function renderProducts(){const q=search.value.toLowerCase().trim();const unitIds=new Set(units.filter(u=>String(u.unit_code||'').toLowerCase().includes(q)).map(u=>u.product_id));const rows=products.filter(p=>!q||[p.name,p.sku,p.barcode,p.quick_code,p.category].join(' ').toLowerCase().includes(q)||unitIds.has(p.id));document.getElementById('products').innerHTML=rows.map(p=>`<article class="product" onclick="pick('${p.id}')"><b>${esc(p.name)}</b><div class="price">${money(p.price)}</div><div class="meta">Qty: ${qtyFor(p)}${p.category?' · '+esc(p.category):''}</div>${p.sku?`<div class="meta">SKU: ${esc(p.sku)}</div>`:''}</article>`).join('')||'<p>No matching products.</p>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pick(id){const p=products.find(x=>x.id===id);if(!p)return;const tracked=!!p.track_individual_units;if(tracked){const code=prompt('Scan / enter IMEI, serial or unit barcode for '+p.name);if(!code)return;const u=units.find(x=>x.product_id===id&&String(x.unit_code).toLowerCase()===code.trim().toLowerCase());if(!u)return alert('Unit not available.');if(cart.some(x=>x.unit_code===u.unit_code))return alert('Already in cart.');cart.push({product_id:id,name:p.name,quantity:1,unit_price:Number(p.price||0),unit_code:u.unit_code,unit_codes:[u.unit_code]})}else{if(qtyFor(p)<=0)return alert('Out of stock.');let r=cart.find(x=>x.product_id===id&&!x.unit_code);if(r){if(r.quantity+1>qtyFor(p))return alert('Not enough stock.');r.quantity++}else cart.push({product_id:id,name:p.name,quantity:1,unit_price:Number(p.price||0),unit_codes:[]})}renderCart();search.value='';renderProducts()}
function renderCart(){cartEl.innerHTML=cart.map((r,i)=>`<div class="cart-row"><span>${esc(r.name)}${r.unit_code?`<div class="meta">${esc(r.unit_code)}</div>`:''}</span><input type="number" min="1" ${r.unit_code?'disabled':''} value="${r.quantity}" onchange="changeQty(${i},this.value)"><input type="number" step=".01" value="${r.unit_price}" onchange="cart[${i}].unit_price=Number(this.value);renderCart()"><button onclick="cart.splice(${i},1);renderCart()">×</button></div>`).join('');const sub=cart.reduce((s,r)=>s+r.quantity*r.unit_price,0),tx=taxEnabled.checked?sub*MW_CONFIG.TAX_RATE:0;subtotal.textContent=money(sub);tax.textContent=money(tx);total.textContent=money(sub+tx)}
function changeQty(i,v){const r=cart[i],p=products.find(x=>x.id===r.product_id),n=Math.max(1,Number(v||1));if(!r.unit_code&&n>qtyFor(p)){alert('Not enough stock.');return renderCart()}r.quantity=n;renderCart()}
const cartEl=document.getElementById('cart');taxEnabled.onchange=renderCart;search.oninput=renderProducts;search.onkeydown=e=>{if(e.key==='Enter'){const q=search.value.trim().toLowerCase();const u=units.find(x=>String(x.unit_code||'').toLowerCase()===q);if(u)return pick(u.product_id);const exact=products.find(p=>[p.barcode,p.sku,p.quick_code,p.name].some(v=>String(v||'').toLowerCase()===q));if(exact)pick(exact.id)}};
function clearCart(){cart=[];renderCart()}
function checkoutCash(){doCheckout('cash',null)}function openCard(){if(!cart.length)return alert('Cart is empty');last4.value='';cardMsg.textContent='';cardModal.classList.add('open')}function closeCard(){cardModal.classList.remove('open')}function completeCard(){const v=last4.value.trim();if(!/^\d{4}$/.test(v)){cardMsg.textContent='Enter exactly 4 digits.';return}closeCard();doCheckout('card',v)}
async function doCheckout(method,last4digits){if(!cart.length)return alert('Cart is empty');const snapshot=cart.map(x=>({...x})),taxOn=taxEnabled.checked,items=snapshot.map(({product_id,quantity,unit_price,unit_codes=[]})=>({product_id,quantity,unit_price,unit_codes}));saleMsg.textContent='Saving sale...';try{const {data,error}=await sb.rpc('create_sale_v2',{p_items:items,p_tax_enabled:taxOn,p_payment:method,p_card_last4:last4digits,p_customer_id:null});if(error)throw error;const sub=snapshot.reduce((s,r)=>s+r.quantity*r.unit_price,0),tx=taxOn?sub*MW_CONFIG.TAX_RATE:0;lastReceipt={id:Array.isArray(data)?data[0]?.id:data?.id||data,date:new Date(),method,last4:last4digits,items:snapshot,subtotal:sub,tax:tx,total:sub+tx};buildReceipt();saleMsg.textContent='Sale completed '+money(sub+tx);cart=[];renderCart();await loadProducts()}catch(e){saleMsg.textContent='Sale failed: '+e.message}}
function buildReceipt(){if(!lastReceipt)return;receiptMeta.innerHTML=`<div class="rrow"><span>Date</span><span>${lastReceipt.date.toLocaleString()}</span></div><div class="rrow"><span>Payment</span><span>${lastReceipt.method.toUpperCase()}${lastReceipt.last4?' • '+lastReceipt.last4:''}</span></div>`;receiptItems.innerHTML=lastReceipt.items.map(x=>`<div>${esc(x.name)} x${x.quantity}<div class="rrow"><span>${x.unit_code?esc(x.unit_code):''}</span><span>${money(x.quantity*x.unit_price)}</span></div></div>`).join('');receiptTotals.innerHTML=`<div class="rrow"><span>Subtotal</span><b>${money(lastReceipt.subtotal)}</b></div><div class="rrow"><span>Tax</span><b>${money(lastReceipt.tax)}</b></div><div class="rrow"><span>Total</span><b>${money(lastReceipt.total)}</b></div>`}
function printReceipt(){if(!lastReceipt)return alert('No completed sale to print.');buildReceipt();window.print()}
requireSession();renderCart();
</script>
</body>
</html>
