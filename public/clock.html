<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mega Wireless Clock</title><style>
body{margin:0;font-family:Arial;background:#020715;color:#f8fbff}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top h1{margin-right:auto}.btn{border:0;padding:10px 13px;border-radius:9px;background:#167aff;color:#fff;font-weight:800;cursor:pointer}.btn.gray{background:#182a48}.card{background:#07152e;border:1px solid #1a3e75;border-radius:12px;padding:16px;margin-top:14px}.big{font-size:26px;font-weight:900;color:#ffbd35;margin:10px 0}.status{color:#ffbd35;font-weight:800;margin:8px 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #16335d;text-align:left}th{color:#9ec8ff}
</style></head><body><div class="wrap"><div class="top"><h1>MEGA WIRELESS — Clock</h1><button class="btn gray" onclick="location.href='pos.html'">Back to POS</button></div><div class="card"><div id="who"></div><div id="state" class="big">Checking...</div><button class="btn" id="clockBtn" onclick="toggleClock()">Clock In</button><div id="msg" class="status"></div></div><h3>Recent Entries</h3><div class="card tablewrap"><table><thead><tr><th>Clock In</th><th>Clock Out</th><th>Hours</th></tr></thead><tbody id="rows"></tbody></table></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(MW_CONFIG.SUPABASE_URL,MW_CONFIG.SUPABASE_ANON_KEY);let user=null,active=null;
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='pos.html';return}user=session.user;who.textContent=user.email||'Staff';const {data,error}=await sb.from('time_entries').select('id,clock_in,clock_out').eq('employee_id',user.id).order('clock_in',{ascending:false}).limit(20);if(error){msg.textContent=error.message;return}active=(data||[]).find(x=>!x.clock_out)||null;state.textContent=active?'Clocked in since '+new Date(active.clock_in).toLocaleTimeString():'Currently clocked out';clockBtn.textContent=active?'Clock Out':'Clock In';rows.innerHTML=(data||[]).map(x=>{const a=new Date(x.clock_in),b=x.clock_out?new Date(x.clock_out):null,h=b?((b-a)/3600000).toFixed(2):'—';return '<tr><td>'+a.toLocaleString()+'</td><td>'+(b?b.toLocaleString():'Active')+'</td><td>'+h+'</td></tr>'}).join('')}
async function toggleClock(){msg.textContent='Saving...';let r;if(active)r=await sb.from('time_entries').update({clock_out:new Date().toISOString()}).eq('id',active.id);else r=await sb.from('time_entries').insert({employee_id:user.id});if(r.error){msg.textContent=r.error.message;return}msg.textContent='Saved';await load()}
load();</script></body></html>
