<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Repair Request Form</title>
</head>
<body>
  <!-- Hidden copy so Netlify Forms detects the homepage "repair-request" form at deploy time. -->
  <form name="repair-request" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="repair-request" />
    <p><label>Do not fill this out: <input name="bot-field" /></label></p>
    <input name="name" />
    <input name="phone" />
    <input name="device" />
    <input name="problem" />
    <input name="preferred_time" />
    <input name="notes" />
    <input name="consent" />
    <input name="page_url" />
    <input name="language" />
    <input name="utm_source" />
    <input name="utm_medium" />
    <input name="utm_campaign" />
    <input name="utm_content" />
    <input name="utm_term" />
  </form>
</body>
</html>
