name: Align site business rules

on:
  push:
    paths:
      - '.github/workflows/align-site-business-rules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align public repair copy and fallback prices
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          repairs = json.loads(Path('public/repairs.json').read_text(encoding='utf-8'))
          repairs_js = 'var REPAIRS=' + json.dumps(repairs, ensure_ascii=False, separators=(',', ':')) + ';'

          replacements = {
              '<meta property="og:description" content="iPhone screen repair in 10 to 15 minutes. Unlocked phones with 3-month warranty. 4717 Nolensville Pike, Nashville.">': '<meta property="og:description" content="Professional phone repair in Nashville with free initial diagnostics. Exact repair pricing is confirmed before work begins. 4717 Nolensville Pike, Nashville.">',
              'Fixed in 15 Minutes.': 'Professional Repair.',
              'iPhone screen repair from $59.99. Free screen protector included. Unlocked phones, prepaid plans and computer repair — all in one place on Nolensville Pike.': 'Professional iPhone and device repair with a free initial diagnostic. We confirm the required repair and price before any work begins.',
              'Free tempered-glass screen protector included with every iPhone screen repair. 90-day repair warranty.': 'Free initial diagnostic. Standard iPhone screen replacements include a 30-day warranty.',
              '10 to 15 Minutes': 'Service Time Varies',
              'Most iPhone models, from $59.99. Parts availability applies. 90-day repair warranty.': 'Approved model-specific pricing is shown above. Parts availability applies. Standard screen replacements include a 30-day warranty.',
              'Family owned and operated in South Nashville. Over 10 years of experience, more than 10,000 devices repaired, and a 90-day warranty on repairs.': 'Family owned and operated in South Nashville. Over 10 years of experience, more than 10,000 devices repaired, free initial diagnostics, and a 30-day warranty on standard screen replacements.',
              'iPhone Screen Repair in 10 to 15 Minutes': 'Free Initial Device Diagnostics',
              'iPhone Screen: 10 to 15 Minutes': 'iPhone Screen Repair: Professional Service',
              'Free Screen Protector with iPhone Screen Repair': '30-Day Warranty on Standard Screen Replacement',

              'Reparada en 15 minutos.': 'Reparación profesional.',
              'Reparación de pantalla de iPhone desde $59.99. Protector de pantalla gratis. Teléfonos desbloqueados, planes prepagados y reparación de computadoras — todo en Nolensville Pike.': 'Reparación profesional de iPhone y otros dispositivos con diagnóstico inicial gratis. Confirmamos la reparación necesaria y el precio antes de comenzar cualquier trabajo.',
              'Protector de pantalla de vidrio templado gratis con cada cambio de pantalla de iPhone. Garantía de 90 días.': 'Diagnóstico inicial gratis. Los cambios de pantalla estándar de iPhone incluyen garantía de 30 días.',
              '10 a 15 minutos': 'Tiempo según el equipo',
              'Protector gratis': 'Diagnóstico inicial gratis',
              'La mayoría de modelos iPhone, desde $59.99. Sujeto a disponibilidad de piezas. Garantía de 90 días.': 'Los precios aprobados por modelo se muestran arriba. Sujeto a disponibilidad de piezas. Garantía de 30 días en cambios de pantalla estándar.',
              'Negocio familiar en el sur de Nashville. Más de 10 años de experiencia, más de 10,000 equipos reparados y garantía de 90 días.': 'Negocio familiar en el sur de Nashville. Más de 10 años de experiencia, más de 10,000 equipos reparados, diagnóstico inicial gratis y garantía de 30 días en cambios de pantalla estándar.',
              'Pantalla de iPhone en 10 a 15 minutos': 'Diagnóstico inicial gratis',
              'Pantalla iPhone: 10 a 15 minutos': 'Reparación profesional de pantalla iPhone',
              'Protector gratis con cambio de pantalla': 'Garantía de 30 días en cambio de pantalla estándar',

              'نصلحها في ١٥ دقيقة.': 'صيانة احترافية.',
              'تغيير شاشة آيفون يبدأ من ٥٩.٩٩ دولار، مع واقي شاشة مجاني. هواتف مفتوحة، خطوط مسبقة الدفع، وصيانة كمبيوتر — كل ذلك في مكان واحد على Nolensville Pike.': 'صيانة احترافية للآيفون والأجهزة الأخرى مع فحص مبدئي مجاني. بنوضح لك الإصلاح المطلوب والسعر قبل ما نبدأ أي شغل.',
              'واقي شاشة زجاجي مجاني مع كل تغيير شاشة آيفون. ضمان ٩٠ يوم على الصيانة.': 'فحص مبدئي مجاني. تغيير شاشة الآيفون القياسي يشمل ضمان ٣٠ يوم.',
              '١٠ إلى ١٥ دقيقة': 'المدة حسب الجهاز',
              'واقي شاشة مجاني': 'فحص مبدئي مجاني',
              'معظم موديلات الآيفون، يبدأ من ٥٩.٩٩$. حسب توفر القطع. ضمان ٩٠ يوم.': 'الأسعار المعتمدة حسب الموديل موضحة بالأعلى. حسب توفر القطع. تغيير الشاشة القياسي يشمل ضمان ٣٠ يوم.',
              'محل عائلي في جنوب ناشفيل. خبرة أكثر من ١٠ سنوات، وأكثر من ١٠٠٠٠ جهاز تم إصلاحه، وضمان ٩٠ يوم على الصيانة.': 'محل عائلي في جنوب ناشفيل. خبرة أكثر من ١٠ سنوات وأكثر من ١٠٠٠٠ جهاز تم إصلاحه، مع فحص مبدئي مجاني وضمان ٣٠ يوم على تغيير الشاشة القياسي.',
              'تغيير شاشة آيفون في ١٠ إلى ١٥ دقيقة': 'فحص مبدئي مجاني',
              'شاشة آيفون: ١٠ إلى ١٥ دقيقة': 'صيانة شاشة آيفون باحتراف',
              'واقي شاشة مجاني مع تغيير الشاشة': 'ضمان ٣٠ يوم على تغيير الشاشة القياسي',
          }

          for filename in ('public/index.html', 'index.html'):
              p = Path(filename)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              text, count = re.subn(r'var REPAIRS=\{.*?\};', repairs_js, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Could not align REPAIRS fallback in {filename}')
              if text != original:
                  p.write_text(text, encoding='utf-8')

          # Production checks: stale generic repair promises must be gone from the production page.
          prod = Path('public/index.html').read_text(encoding='utf-8')
          forbidden = [
              '90-day repair warranty',
              'Garantía de 90 días',
              'ضمان ٩٠ يوم على الصيانة',
              'Fixed in 15 Minutes.',
              'Reparada en 15 minutos.',
              'نصلحها في ١٥ دقيقة.',
          ]
          for phrase in forbidden:
              if phrase in prod:
                  raise SystemExit(f'Stale production phrase remains: {phrase}')

          # Verify approved fallback pricing is present.
          required = ['$59.99','$69.99','$89.99','$99.00','$119.99','$130','$49.99','$79.99','$39.99']
          missing = [x for x in required if x not in prod]
          if missing:
              raise SystemExit(f'Missing expected approved fallback values: {missing}')
          PY

      - name: Commit aligned site copy
        shell: bash
        run: |
          if git diff --quiet -- public/index.html index.html; then
            echo 'No site changes needed.'
            exit 0
          fi
          git config user.name 'Mega Wireless Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add public/index.html index.html
          git commit -m 'Align website repair claims with approved AI policies'
          git push
