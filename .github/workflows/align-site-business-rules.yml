name: Align site business rules

on:
  push:
    paths:
      - '.github/workflows/align-site-business-rules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct repair copy without changing active promotion copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          repairs = json.loads(Path('public/repairs.json').read_text(encoding='utf-8'))
          repairs_js = 'var REPAIRS=' + json.dumps(repairs, ensure_ascii=False, separators=(',', ':')) + ';'

          replacements = {
              '<div class="repair-gift" data-i18n="rp1g">Free Screen Protector</div>': '<div class="repair-gift" data-i18n="rp1g">Free Initial Diagnostic</div>',
              'rp1g:"Free Screen Protector"': 'rp1g:"Free Initial Diagnostic"',
              'iPhone Screen Repair in Service Time Varies': 'Free Initial Device Diagnostics',
              'iPhone Screen: Service Time Varies': 'iPhone Screen Repair: Professional Service',

              'bs1c:"Diagnóstico inicial gratis con pantalla de iPhone"': 'bs1c:"Protector gratis con pantalla de iPhone"',
              'Pantalla de iPhone en Tiempo según el equipo': 'Diagnóstico inicial gratis',
              'Pantalla iPhone: Tiempo según el equipo': 'Reparación profesional de pantalla iPhone',
              'Diagnóstico inicial gratis con cambio de pantalla': 'Garantía de 30 días en cambio de pantalla estándar',

              'bs1c:"فحص مبدئي مجاني مع شاشة الآيفون"': 'bs1c:"واقي شاشة مجاني مع شاشة الآيفون"',
              'تغيير شاشة آيفون في المدة حسب الجهاز': 'فحص مبدئي مجاني',
              'شاشة آيفون: المدة حسب الجهاز': 'صيانة شاشة آيفون باحتراف',
              'فحص مبدئي مجاني مع تغيير الشاشة': 'ضمان ٣٠ يوم على تغيير الشاشة القياسي',
          }

          for filename in ('public/index.html', 'index.html'):
              p = Path(filename)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              text, count = re.subn(r'var REPAIRS=\{.*?\};', repairs_js, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Could not align REPAIRS fallback in {filename}')
              if text != original:
                  p.write_text(text, encoding='utf-8')

          prod = Path('public/index.html').read_text(encoding='utf-8')

          forbidden = [
              '90-day repair warranty',
              'Garantía de 90 días',
              'ضمان ٩٠ يوم على الصيانة',
              'Fixed in 15 Minutes.',
              'Reparada en 15 minutos.',
              'نصلحها في ١٥ دقيقة.',
              'iPhone Screen Repair in Service Time Varies',
              'Pantalla de iPhone en Tiempo según el equipo',
              'تغيير شاشة آيفون في المدة حسب الجهاز',
          ]
          for phrase in forbidden:
              if phrase in prod:
                  raise SystemExit(f'Stale or malformed production phrase remains: {phrase}')

          required = [
              'Free initial diagnostic. Standard iPhone screen replacements include a 30-day warranty.',
              'rp1g:"Free Initial Diagnostic"',
              'rp1g:"Diagnóstico inicial gratis"',
              'rp1g:"فحص مبدئي مجاني"',
              'bs1c:"Protector gratis con pantalla de iPhone"',
              'bs1c:"واقي شاشة مجاني مع شاشة الآيفون"',
              '$119.99', '$130', '$49.99', '$79.99', '$39.99'
          ]
          missing = [x for x in required if x not in prod]
          if missing:
              raise SystemExit(f'Missing required production values: {missing}')
          PY

      - name: Commit corrected site copy
        shell: bash
        run: |
          if git diff --quiet -- public/index.html index.html; then
            echo 'No site changes needed.'
            exit 0
          fi
          git config user.name 'Mega Wireless Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add public/index.html index.html
          git commit -m 'Correct website repair copy and preserve promotions'
          git push
