name: Fix Botpress Public Markup

on:
  push:
    paths:
      - '.github/workflows/install-botpress-public.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix escaped newlines in launcher block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/index.html')
          html = path.read_text(encoding='utf-8')
          start_marker = r'\n<!-- Mega Wireless AI Chat launcher -->\n'
          end_marker = r'<!-- /Mega Wireless AI Chat launcher -->\n'

          if start_marker not in html:
              print('Escaped launcher block not found; no change needed')
              raise SystemExit(0)

          start = html.index(start_marker)
          end = html.index(end_marker, start) + len(end_marker)
          block = html[start:end]
          fixed = block.replace('\\n', '\n')
          html = html[:start] + fixed + html[end:]
          path.write_text(html, encoding='utf-8')
          print('Launcher markup fixed')
          PY

      - name: Commit markup fix
        shell: bash
        run: |
          if git diff --quiet -- public/index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Mega Wireless Automation"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html
          git commit -m "Fix Botpress launcher markup on public site"
          git push
