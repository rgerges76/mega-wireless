name: Install Botpress Webchat

on:
  push:
    paths:
      - '.github/workflows/install-botpress-webchat.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Botpress webchat into homepage
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = 'https://cdn.botpress.cloud/webchat/v5.0/inject.js'

          if marker in html:
              print('Botpress webchat is already installed; no change needed.')
              raise SystemExit(0)

          snippet = '''\n<!-- Mega Wireless Botpress Webchat -->
<script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js"></script>
<script src="https://files.bpcontent.cloud/2026/08/28/15/20260828155536-V0H9SFBE.js" defer></script>
<style id="mega-botpress-layout">
  /* Keep the existing WhatsApp / Call / Map buttons clear of the AI chat launcher. */
  .floating{right:auto!important;left:16px!important}
  html[dir="rtl"] .floating{left:auto!important;right:16px!important}
</style>
<!-- /Mega Wireless Botpress Webchat -->\n'''

          if '</head>' not in html:
              raise SystemExit('index.html has no </head> tag')

          html = html.replace('</head>', snippet + '</head>', 1)
          path.write_text(html, encoding='utf-8')
          print('Botpress webchat injected into index.html')

      - name: Commit installation
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Mega Wireless Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Install Botpress webchat on homepage"
          git push
