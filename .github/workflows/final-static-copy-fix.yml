name: Final static copy cleanup

on:
  push:
    paths:
      - '.github/workflows/final-static-copy-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix static Xbox repair copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ('public/index.html','index.html'):
              p=Path(filename)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=s.replace('<li data-i18n="xb2a">Same-day service available</li>','<li data-i18n="xb2a">Service time confirmed after inspection</li>')
              s=s.replace('<li data-i18n="xb2c">Repair warranty included</li>','<li data-i18n="xb2c">Ask about warranty details</li>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- public/index.html index.html; then exit 0; fi
          git config user.name 'Mega Wireless Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add public/index.html index.html
          git commit -m 'Clean up final static repair claims'
          git push
