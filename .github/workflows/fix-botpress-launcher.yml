name: Fix Botpress Launcher

on:
  push:
    paths:
      - '.github/workflows/fix-botpress-launcher.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add reliable Mega Wireless AI chat launcher
        shell: bash
        run: |
          python -c "from pathlib import Path; import base64; p=Path('index.html'); h=p.read_text(encoding='utf-8'); b=base64.b64decode('').decode(); p.write_text(h if 'id=\"mega-ai-chat-button\"' in h else h.replace('</body>', b+'\n</body>',1), encoding='utf-8')"

      - name: Commit launcher fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Mega Wireless Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add reliable Botpress AI chat launcher"
          git push
