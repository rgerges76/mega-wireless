backend:
  name: git-gateway
  branch: main

publish_mode: simple
media_folder: "assets/phones"
public_folder: "/assets/phones"

collections:
  - name: "repairs"
    label: "Repair Prices"
    files:
      - name: "repairs"
        label: "Screen & Service Prices"
        file: "data/repairs.json"
        description: "These are the prices customers see on the website. Turn a line OFF to hide it."
        fields:
          - name: "screens"
            label: "iPhone Screen Prices"
            label_singular: "Screen Price"
            widget: "list"
            summary: "{{fields.model}} - {{fields.price}}"
            fields:
              - { name: "model",  label: "Model (e.g. iPhone 13)", widget: "string" }
              - { name: "price",  label: "Price (e.g. $79.99)", widget: "string" }
              - { name: "active", label: "Show on website?", widget: "boolean", default: true }
          - name: "services"
            label: "Other Repair Prices"
            label_singular: "Service"
            widget: "list"
            summary: "{{fields.service}} - {{fields.price}}"
            fields:
              - { name: "service", label: "Service name", widget: "string" }
              - { name: "price",   label: "Price (or type Free)", widget: "string" }
              - { name: "active",  label: "Show on website?", widget: "boolean", default: true }

  - name: "phones"
    label: "Phones For Sale"
    files:
      - name: "phones"
        label: "Phone List & Prices"
        file: "data/phones.json"
        description: "Change prices, add photos, or hide a phone that is out of stock. Turn the switch OFF to hide it without deleting it."
        fields:
          - name: "phones"
            label: "Phones"
            label_singular: "Phone"
            widget: "list"
            summary: "{{fields.name}} - {{fields.price}}"
            fields:
              - { name: "name",   label: "Phone Name (e.g. iPhone 13)", widget: "string" }
              - { name: "specs",  label: "Storage / Details (e.g. 128GB)", widget: "string", required: false }
              - { name: "price",  label: "Price - type exactly as it should appear (e.g. $299.00)", widget: "string" }
              - { name: "image",  label: "Photo (optional)", widget: "image", required: false }
              - { name: "bundle", label: "Includes free case + screen protector?", widget: "boolean", default: true }
              - { name: "active", label: "Show on website?", widget: "boolean", default: true }

  - name: "offers"
    label: "Daily Offers"
    files:
      - name: "offers"
        label: "Today's Offers"
        file: "offers.json"
        description: "An offer shows only when the switch is ON and the end date has not passed."
        fields:
          - name: "offers"
            label: "Offers"
            label_singular: "Offer"
            widget: "list"
            summary: "{{fields.title}} - {{fields.price}}"
            fields:
              - { name: "title",       label: "Offer Title", widget: "string" }
              - { name: "price",       label: "Big Price Text (e.g. $10 Off)", widget: "string" }
              - { name: "description", label: "Description - one or two short lines", widget: "text" }
              - { name: "valid_until", label: "Offer Ends On", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { name: "active",      label: "Show on website?", widget: "boolean", default: false }
